<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Home">
<title>My Home</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0a4a8c">
<style>
/* Layout: full-screen photo behind; frosted-glass cards float on the edges, the centre stays clear for the photo */
:root {
  --glass: rgba(255, 255, 255, .64);
  --glass-strong: rgba(255, 255, 255, .82);
  --field: rgba(255, 255, 255, .75);
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --hair: rgba(0, 0, 0, .08);
  --blue: #007aff;
  --orange: #ff9500;
  --red: #ff3b30;
  --font: -apple-system, "SF Pro Display", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #e9eef6; color: var(--ink); font: 17px/1.35 var(--font); letter-spacing: -.01em;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
input, select, button { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid rgba(0, 122, 255, .5); outline-offset: 2px; }

/* ---------- Fond : photos en fondu enchaîné ---------- */
.bg { position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(circle at 15% 20%, #ffd3a5 0, transparent 45%),
              radial-gradient(circle at 85% 15%, #a5d8ff 0, transparent 45%),
              radial-gradient(circle at 70% 85%, #d0bfff 0, transparent 50%),
              radial-gradient(circle at 20% 90%, #b2f2bb 0, transparent 45%), #f1f3f8; }
.bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s ease; }
.bg img.on { opacity: 1; -webkit-animation: drift 14s ease-out both; animation: drift 14s ease-out both; }
@-webkit-keyframes drift { from { -webkit-transform: scale(1.08); } to { -webkit-transform: scale(1); } }
@keyframes drift { from { transform: scale(1.08); } to { transform: scale(1); } }

/* ---------- Grille ---------- */
.app {
  position: relative; height: 100%; display: grid; gap: 16px;
  grid-template-columns: 330px 1fr 300px;
  grid-template-rows: auto 1fr;
  grid-template-areas: "clock . weather" "agenda . list";
  padding: max(22px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
}
@media (orientation: portrait) {
  .app { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr 44%;
    grid-template-areas: "clock weather" ". ." "agenda list"; }
}
@media (max-width: 600px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-columns: 1fr; grid-template-rows: auto;
    grid-template-areas: "clock" "weather" "agenda" "list"; }
  .agenda .scroll, .list .scroll { max-height: 50vh; }
}

.card {
  background: var(--glass); border-radius: 24px; padding: 18px 20px; min-width: 0; min-height: 0;
  -webkit-backdrop-filter: saturate(180%) blur(28px); backdrop-filter: saturate(180%) blur(28px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .12), inset 0 0 0 1px rgba(255, 255, 255, .5);
  display: flex; flex-direction: column; gap: 12px;
}
.card h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.card header { display: flex; align-items: baseline; gap: 10px; }
.card header h2 { flex: 1; }
.count { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -6px; padding: 0 6px; }
.hint { color: var(--ink-2); font-size: 15px; padding: 6px 0; }

/* ---------- Heure ---------- */
/* Dans une carte de verre comme la météo : lisible sur n'importe quelle photo */
.clock { grid-area: clock; align-self: start; justify-self: start; gap: 2px; padding: 14px 24px 16px; }
.clock .time { font-size: 84px; font-weight: 300; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.clock .date { font-size: 20px; font-weight: 600; color: var(--ink-2); padding-left: 3px; }
.clock .date::first-letter { text-transform: uppercase; }

/* ---------- Météo ---------- */
.weather { grid-area: weather; }
.now { display: flex; align-items: center; gap: 14px; }
.now .ico { font-size: 50px; line-height: 1; }
.now .temp { font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: -.03em; }
.now .lbl { color: var(--ink-2); font-size: 15px; }
.city { margin-left: auto; align-self: flex-start; background: none; border: 0; padding: 0; color: var(--blue); font-size: 15px; font-weight: 500; }
/* 7 jours qui défilent au doigt : 3 visibles, le 4e dépasse pour inviter à glisser */
.days { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 24px) / 3.25); gap: 8px; text-align: center;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; scrollbar-width: none; margin-right: -20px; padding-right: 20px; }
.days::-webkit-scrollbar { display: none; }
.days > div { scroll-snap-align: start; }
.days > div { background: rgba(255, 255, 255, .55); border-radius: 16px; padding: 8px 4px; font-size: 14px; }
.days .d { color: var(--ink-2); font-weight: 600; text-transform: capitalize; }
.days b { display: block; font-size: 26px; font-weight: 400; line-height: 1.3; }
.days .rain { color: var(--blue); font-size: 12px; font-weight: 600; }

/* ---------- Rappels ---------- */
.agenda { grid-area: agenda; align-self: end; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.agenda .scroll { flex: none; overflow: visible; }
.agenda header { align-items: center; }
.btn.small { padding: 6px 12px; font-size: 15px; }
.due { background: var(--orange); color: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 6px 18px rgba(255, 149, 0, .35); }
.due small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.due div { font-size: 20px; font-weight: 600; }
#todayList { display: flex; flex-direction: column; gap: 4px; }
#todayList .due { margin-bottom: 4px; }
.later { display: flex; align-items: baseline; gap: 10px; padding: 4px 2px; color: #8e8e93; font-size: 16px; }
.later b { flex: 0 0 64px; font-size: 13px; font-weight: 600; text-transform: capitalize; }
.later span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.panel h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.ev { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.ev:last-child { border-bottom: 0; }
.ev .when { flex: 0 0 auto; min-width: 66px; text-align: center; padding: 4px 8px; border-radius: 10px; background: rgba(255,255,255,.6); font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: capitalize; }
.ev.today .when { background: var(--orange); color: #fff; }
.ev.tomorrow .when { background: var(--blue); color: #fff; }
.ev .what { flex: 1; min-width: 0; font-weight: 500; }
.ev .rep { font-size: 13px; color: var(--ink-2); font-weight: 400; }
.x { background: none; border: 0; color: #aeaeb2; font-size: 24px; line-height: 1; padding: 2px 4px; }
.x:active { color: var(--red); }

/* ---------- Formulaires ---------- */
.field { background: var(--field); border: 0; border-radius: 12px; padding: 10px 12px; min-width: 0; width: 100%;
  -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
.field::placeholder { color: #8e8e93; }
select.field { padding-right: 8px; }
.btn { background: var(--blue); color: #fff; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; white-space: nowrap; }
.btn.soft { background: rgba(0, 122, 255, .12); color: var(--blue); }
.btn:active { opacity: .7; }
.addev { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.addev .wide { grid-column: 1 / -1; }
.addrow { display: flex; gap: 8px; }

/* ---------- Courses ---------- */
.list { grid-area: list; align-self: end; max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.list .scroll { flex: none; overflow: visible; }
.list .count { background: var(--orange); color: #fff; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
.add { position: relative; }
.add .field { border-radius: 999px; padding: 11px 92px 11px 16px; }
.add .mic { position: absolute; right: 45px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: rgba(0, 122, 255, .12); color: var(--blue); display: flex; align-items: center; justify-content: center; padding: 0; }
.add .mic svg { width: 18px; height: 18px; fill: currentColor; }
.add .mic.on { background: var(--red); color: #fff; -webkit-animation: pulse 1.2s ease-in-out infinite; animation: pulse 1.2s ease-in-out infinite; }
@-webkit-keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 59, 48, .2); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 59, 48, .2); } }
.add .plus { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--blue); color: #fff; font-size: 26px; font-weight: 300; line-height: 1; padding: 0 0 3px; }
.add .plus:active { opacity: .7; }
.clear { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--blue); font-size: 15px; font-weight: 500; }
.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); column-gap: 18px; align-content: start; }
.items li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.items li span { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; }
.items .edit { flex: 1; padding: 6px 10px; margin: -6px 0; border-radius: 10px; font-size: inherit; box-shadow: inset 0 0 0 2px var(--blue); }
.tick { flex: 0 0 24px; height: 24px; border-radius: 50%; border: 2px solid #c7c7cc; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s; }
.items li.done .tick { background: var(--orange); border-color: var(--orange); }
.items li.done .tick::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.items li.done span { color: #8e8e93; text-decoration: line-through; }

/* ---------- Message quand le dossier photos est vide ---------- */
.pill { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 44px);
  background: var(--glass-strong); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-radius: 999px; padding: 10px 20px; font-size: 15px; font-weight: 500; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.15); }
@media (orientation: portrait) { .pill { bottom: calc(44% + 40px); } }
@media (max-width: 600px) { .pill { bottom: max(16px, env(safe-area-inset-bottom)); } }
/* Téléphone : heure compacte, puis ce qui sert en magasin (courses) avant le reste */
@media (max-width: 600px) {
  .app { gap: 12px; grid-template-areas: "clock" "list" "agenda" "weather"; }
  .clock { justify-self: stretch; flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 12px; padding: 12px 20px; }
  .clock .time { font-size: 46px; }
  .clock .date { font-size: 16px; }
  .list, .agenda { align-self: stretch; max-height: none; overflow: visible; }
  .items li { padding: 13px 0; font-size: 18px; }
  .pill { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bg img { transition: none; } .bg img.on { -webkit-animation: none; animation: none; } }
</style>
</head>
<body>
<div class="bg"><img id="imgA" alt=""><img id="imgB" alt=""></div>

<div class="app">
  <div class="card clock">
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <section class="card weather">
    <div class="now">
      <div class="ico" id="wIco">·</div>
      <div>
        <div class="temp" id="wTemp">--°</div>
        <div class="lbl" id="wLbl">Chargement de la météo…</div>
      </div>
      <button class="city" id="city" title="Changer de ville"></button>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section class="card agenda">
    <header><h2>Rappels</h2><button class="btn soft small" id="evToggle">+ Ajouter</button></header>
    <div id="todayList"></div>
    <div class="panel" id="evPanel" hidden>
    <form class="addev" id="evForm">
      <input class="field wide" id="evText" type="text" placeholder="Sortir les poubelles…" autocomplete="off">
      <input class="field" id="evDate" type="date">
      <select class="field" id="evRep">
        <option value="0">Une fois</option>
        <option value="1">Tous les jours</option>
        <option value="7">Chaque semaine</option>
        <option value="14">Toutes les 2 sem.</option>
        <option value="30">Chaque mois</option>
        <option value="365">Chaque année</option>
      </select>
      <button class="btn wide">Ajouter le rappel</button>
    </form>
    <h3>Tous les rappels</h3>
    <div class="scroll" id="agenda"></div>
    </div>
  </section>

  <section class="card list">
    <header>
      <h2>Courses</h2>
      <span class="count" id="count" hidden></span>
    </header>
    <form class="add" id="itemForm">
      <input class="field" id="itemText" type="text" placeholder="Ajouter un article" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-label="Dicter un article"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3zm6-3a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-2.1A8 8 0 0 0 20 12h-2z"/></svg></button>
      <button class="plus" aria-label="Ajouter l'article">+</button>
    </form>
    <div class="scroll"><ul class="items" id="items"></ul></div>
    <button class="clear" id="clearDone" hidden>Retirer les articles cochés</button>
  </section>
</div>

<div class="pill" id="photoMsg" hidden></div>

<script>
"use strict";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
/* ---------- Réglages Google Drive (voir les explications) ---------- */
var DRIVE_FOLDER_ID = "1oDg4Igm6kSV_6kCZL4uiwGQBLRfZj0WS";   // l'identifiant du dossier « Cadre photo »
var DRIVE_API_KEY = "AIzaSyDpIErxLrooUVoeN9QkOAa5DdMmRtKlLog";   // la clé API Google, limitée à ce site et à Drive
var $ = function (id) { return document.getElementById(id); };
function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

/* ---------- Horloge ---------- */
function tick() {
  var n = new Date();
  $("clock").textContent = n.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  $("date").textContent = n.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}
tick(); setInterval(tick, 10000);

/* ---------- Météo (Open-Meteo, sans clé) ---------- */
var place = load("place", { name: "Paris", lat: 48.8566, lon: 2.3522 });
var WMO = [[0, "☀️", "Ensoleillé"], [2, "⛅", "Éclaircies"], [3, "☁️", "Couvert"], [48, "🌫️", "Brouillard"],
  [57, "🌦️", "Bruine"], [67, "🌧️", "Pluie"], [77, "🌨️", "Neige"], [82, "🌦️", "Averses"], [86, "🌨️", "Averses de neige"], [99, "⛈️", "Orage"]];
function wmo(c) { for (var i = 0; i < WMO.length; i++) if (c <= WMO[i][0]) return WMO[i]; return WMO[WMO.length - 1]; }

function weather() {
  $("city").textContent = place.name;
  var u = "https://api.open-meteo.com/v1/forecast?latitude=" + place.lat + "&longitude=" + place.lon +
    "&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=8";
  fetch(u).then(function (r) { return r.json(); }).then(function (d) {
    var w = wmo(d.current.weather_code);
    $("wIco").textContent = w[1];
    $("wTemp").textContent = Math.round(d.current.temperature_2m) + "°";
    $("wLbl").textContent = w[2] + " · vent " + Math.round(d.current.wind_speed_10m) + " km/h";
    var days = $("days"); days.innerHTML = "";
    for (var i = 1; i < 8; i++) {
      var c = el("div");
      c.appendChild(el("div", "d", parseYmd(d.daily.time[i]).toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "")));
      c.appendChild(el("b", null, wmo(d.daily.weather_code[i])[1]));
      c.appendChild(el("div", null, Math.round(d.daily.temperature_2m_min[i]) + "° · " + Math.round(d.daily.temperature_2m_max[i]) + "°"));
      c.appendChild(el("div", "rain", "💧 " + d.daily.precipitation_probability_max[i] + " %"));
      days.appendChild(c);
    }
  }).catch(function () { $("wLbl").textContent = "Météo indisponible (pas de connexion ?)"; });
}
$("city").onclick = function () {
  var btn = $("city"), f = el("form", "addrow"), inp = el("input", "field");
  inp.placeholder = "Ta ville"; f.style.marginLeft = "auto"; f.style.maxWidth = "190px";
  f.appendChild(inp); f.appendChild(el("button", "btn", "OK"));
  btn.replaceWith(f); inp.focus();
  f.onsubmit = function (e) {
    e.preventDefault();
    fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=" + encodeURIComponent(inp.value.trim()))
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d.results || !d.results.length) { inp.value = ""; inp.placeholder = "Introuvable"; return; }
        var r = d.results[0];
        place = { name: r.name, lat: r.latitude, lon: r.longitude }; save("place", place);
        f.replaceWith(btn); weather();
      });
  };
};
weather(); setInterval(weather, 30 * 60000);
// Après un glissement, revient sur les prochains jours au bout de 30 s.
var daysTimer;
$("days").addEventListener("scroll", function () {
  clearTimeout(daysTimer);
  daysTimer = setTimeout(function () { $("days").scrollTo({ left: 0, behavior: "smooth" }); }, 30000);
});

/* ---------- Courses (partagées via Google Apps Script, sinon gardées sur l'iPad) ---------- */
var SHOP_URL = "https://script.google.com/macros/s/AKfycbyiZzRkPI9UOSMAoqWyqQ-3yWl0qLpi1VDFxWph-NlUJiMA_LxV6XN2Q1tBQTxOE8sHJw/exec";  // adresse /exec du script Google « Courses »
var items = load("items", []);
// Envoie l'action au script, puis relit la liste (celle de Siri et du téléphone comprise).
// Une réponse arrivée pendant d'autres actions est périmée : on ne l'affiche pas, sinon un article
// coché juste après se décocherait. On relit une fois que toutes les actions sont enregistrées.
var pending = 0, gen = 0;
function shop(params) {
  if (!SHOP_URL) return;
  var mine = params ? ++gen : gen;
  if (params) pending++;
  fetch(SHOP_URL + "?" + (params || ""))
    .then(function (r) { return r.json(); })
    .then(function (list) {
      if (params) { if (--pending === 0) shop(); return; }
      if (mine !== gen || pending || editing) return; // pas pendant une correction en cours
      // Ancien script : juste la liste de courses. Nouveau : { courses, rappels }.
      items = Array.isArray(list) ? list : list.courses; save("items", items); renderItems();
      if (!list.rappels) return;
      // Rappels créés sur l'iPad avant le partage : on les envoie une fois en ligne.
      var local = events.filter(function (ev) { return !ev.id && !ev.sent; });
      if (local.length) {
        local.forEach(function (ev) { ev.sent = true; shop("radd=" + encodeURIComponent(ev.text) + "&date=" + ev.date + "&every=" + (ev.every || 0)); });
        save("events", events);
        return;
      }
      events = list.rappels; save("events", events); renderEvents();
    }, function () { if (params && --pending === 0) shop(); });
}
function renderItems() {
  var ul = $("items"); ul.innerHTML = "";
  if (!items.length) ul.appendChild(el("li", "hint", "Rien à acheter pour l'instant."));
  // Les articles cochés descendent en bas de la liste.
  items.filter(function (i) { return !i.done; }).concat(items.filter(function (i) { return i.done; })).forEach(function (it) {
    var li = el("li", it.done ? "done" : ""), text = el("span", null, it.text);
    li.appendChild(el("div", "tick")); li.appendChild(text);
    // Le texte se corrige, le reste de la ligne (le rond) coche / décoche.
    li.onclick = function (e) {
      if (e.target === text) { editItem(it, text); return; }
      if (editing) return;
      it.done = !it.done; save("items", items); renderItems(); if (it.id) shop("toggle=" + encodeURIComponent(it.id));
    };
    ul.appendChild(li);
  });
  var left = items.filter(function (i) { return !i.done; }).length;
  $("count").textContent = left; $("count").hidden = !left;
  $("clearDone").hidden = left === items.length;
}
// Remplace le texte par un champ ; Entrée ou toucher ailleurs enregistre, Échap annule.
var editing = false;
function editItem(it, span) {
  if (editing) return;
  editing = true;
  var inp = el("input", "field edit"); inp.value = it.text; inp.setAttribute("aria-label", "Modifier l'article");
  span.replaceWith(inp); inp.focus(); inp.select();
  var done = function (keep) {
    if (!editing) return;
    editing = false;
    var t = inp.value.trim();
    if (keep && t && t !== it.text) {
      it.text = t; save("items", items);
      if (it.id) shop("edit=" + encodeURIComponent(it.id) + "&text=" + encodeURIComponent(t));
    }
    renderItems();
  };
  inp.onkeydown = function (e) { if (e.key === "Enter") done(true); if (e.key === "Escape") done(false); };
  inp.onblur = function () { done(true); };
}
function addItem() {
  var t = $("itemText").value.trim(); if (!t) return;
  items.push({ text: t, done: false }); save("items", items); $("itemText").value = ""; renderItems();
  shop("add=" + encodeURIComponent(t));
}
$("itemForm").onsubmit = function (e) { e.preventDefault(); addItem(); };
// Dictée : « carotte ajouter » ajoute l'article sans toucher le +.
// La dictée de l'iPad ne prévient pas toujours la page : on regarde aussi le champ deux fois par seconde.
// La dictée écrit « ajouter » de bien des façons : ajoute, ajouté, ajoutée(s), ajoutez…
var SAY_ADD = /^(.*?)[\s,.]*\bajout(?:e|er|ez|é|ée|és|ées|ait|ais)?[\s.!]*$/i;
function checkSaidAdd() {
  var m = $("itemText").value.match(SAY_ADD);
  // On ferme le clavier : sinon l'iPad reste sur la dictée sans plus rien enregistrer.
  if (m && m[1].trim()) { $("itemText").value = m[1]; addItem(); $("itemText").blur(); }
}
$("itemText").addEventListener("input", checkSaidAdd);
setInterval(function () { if (document.activeElement === $("itemText")) checkSaidAdd(); }, 500);
// Bouton micro : reconnaissance vocale de Safari si elle est permise, sinon ouvre le clavier (et son micro).
// Safari sur iPad écoute sans fin : on s'arrête après 1 s de silence ou dès qu'on entend « ajouter ».
// Dans l'appli de l'écran d'accueil de l'iPad (navigator.standalone), iPadOS 15 bloque cette écoute
// sans prévenir : on ouvre alors le clavier, dont le micro marche (« carotte ajouter »).
var Speech = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, finish = null;
// Dans l'appli iPad, le 🎤 lance le raccourci « Frigo » (action « Dicter le texte »), qui, lui, peut écouter.
var SHORTCUT = "Frigo";
$("mic").onclick = function () {
  if (navigator.standalone) { location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT); return; }
  if (rec) { finish(); return; }  // deuxième appui : on arrête toujours, sans attendre Safari
  if (!Speech) { $("itemText").focus(); return; }
  var heard = "", quiet, me = new Speech();
  // Termine une seule fois, quelle que soit la cause (silence, appui, délai, fin normale).
  finish = function () {
    if (rec !== me) return;
    clearTimeout(quiet); clearTimeout(giveUp); rec = null; $("mic").classList.remove("on");
    try { me.abort(); } catch (err) {}
    var m = heard.match(SAY_ADD); $("itemText").value = m ? m[1] : heard;
    addItem();
  };
  var giveUp = setTimeout(function () { if (!heard) finish(); }, 8000); // rien entendu : on lâche
  me.lang = "fr-FR"; me.interimResults = true; me.maxAlternatives = 1;
  me.onresult = function (e) {
    heard = ""; for (var i = 0; i < e.results.length; i++) heard += e.results[i][0].transcript;
    $("itemText").value = heard;
    clearTimeout(quiet);
    if (SAY_ADD.test(heard) || e.results[e.results.length - 1].isFinal) finish();
    else quiet = setTimeout(finish, 1000);
  };
  me.onerror = function (e) { if (e.error === "not-allowed" || e.error === "service-not-allowed") Speech = null; finish(); };
  me.onend = finish;
  rec = me; $("mic").classList.add("on");
  try { me.start(); } catch (err) { finish(); $("itemText").focus(); }
};
$("clearDone").onclick = function () { items = items.filter(function (i) { return !i.done; }); save("items", items); renderItems(); shop("clear=1"); };
renderItems();
shop(); setInterval(shop, 60000); // récupère ce qui a été ajouté par Siri ou le téléphone
// Au retour dans l'appli (après le raccourci « Frigo », par exemple) : relecture immédiate.
document.addEventListener("visibilitychange", function () { if (!document.hidden) shop(); });

/* ---------- Rappels ---------- */
var events = load("events", []);
// Prochaine occurrence d'un rappel (répété tous les `every` jours), ou null s'il est passé.
// every : nombre de jours, sauf 30 = chaque mois et 365 = chaque année (même jour du calendrier).
function nextDate(ev, t) {
  var d = parseYmd(ev.date);
  if (d >= t) return d;
  if (!ev.every) return null;
  if (ev.every === 30 || ev.every === 365) {
    var step = ev.every === 30 ? 1 : 12, k = 1;
    while (addMonths(d, k * step) < t) k++;
    return addMonths(d, k * step);
  }
  var late = Math.round((t - d) / 864e5);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + Math.ceil(late / ev.every) * ev.every);
}
// Le 31 devient le 30 (ou le 28 février) les mois plus courts ; un 29 février, le 28 hors années bissextiles.
function addMonths(d, n) {
  var last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate();
  return new Date(d.getFullYear(), d.getMonth() + n, Math.min(d.getDate(), last));
}
var REPEAT = { 1: "Tous les jours", 7: "Chaque semaine", 14: "Toutes les 2 semaines", 30: "Chaque mois", 365: "Chaque année" };
function shortDate(d, diff) {
  if (diff === 1) return "Demain";
  return d.toLocaleDateString("fr-FR", diff < 7 ? { weekday: "short", day: "numeric" } : { day: "numeric", month: "short" }).replace(".", "");
}
function renderEvents() {
  var t = today(), box = $("agenda"); box.innerHTML = "";
  events = events.filter(function (ev) { return nextDate(ev, t); }); save("events", events);
  var list = events.map(function (ev) { return { ev: ev, d: nextDate(ev, t) }; }).sort(function (a, b) { return a.d - b.d; });
  // À l'écran : ceux du jour en orange, les suivants en gris.
  var due = $("todayList"); due.innerHTML = "";
  var todays = list.filter(function (x) { return x.d - t === 0; });
  if (todays.length) {
    var card = el("div", "due"); card.appendChild(el("small", null, "Aujourd'hui"));
    todays.forEach(function (x) { card.appendChild(el("div", null, x.ev.text)); });
    due.appendChild(card);
  }
  list.filter(function (x) { return x.d - t > 0; }).slice(0, 3).forEach(function (x) {
    var diff = Math.round((x.d - t) / 864e5), row = el("div", "later");
    row.appendChild(el("b", null, shortDate(x.d, diff)));
    row.appendChild(el("span", null, x.ev.text));
    due.appendChild(row);
  });
  if (!list.length) due.appendChild(el("div", "hint", "Aucun rappel pour l'instant."));
  if (!list.length) box.appendChild(el("div", "hint", "Aucun rappel pour l'instant."));
  list.forEach(function (x) {
    var diff = Math.round((x.d - t) / 864e5);
    var row = el("div", "ev" + (diff === 0 ? " today" : diff === 1 ? " tomorrow" : ""));
    row.appendChild(el("div", "when", diff === 0 ? "Aujourd'hui" : diff === 1 ? "Demain" : x.d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric" }).replace(".", "")));
    var what = el("div", "what", x.ev.text);
    if (x.ev.every) what.appendChild(el("div", "rep", REPEAT[x.ev.every] || "Tous les " + x.ev.every + " jours"));
    row.appendChild(what);
    var del = el("button", "x", "×"); del.setAttribute("aria-label", "Supprimer le rappel");
    del.onclick = function () {
      events.splice(events.indexOf(x.ev), 1); save("events", events); renderEvents();
      if (x.ev.id) shop("rdel=" + encodeURIComponent(x.ev.id));
    };
    row.appendChild(del); box.appendChild(row);
  });
}
$("evDate").value = ymd(today());
$("evForm").onsubmit = function (e) {
  e.preventDefault(); var t = $("evText").value.trim(); if (!t || !$("evDate").value) return;
  events.push({ text: t, date: $("evDate").value, every: +$("evRep").value, sent: !!SHOP_URL }); save("events", events);
  shop("radd=" + encodeURIComponent(t) + "&date=" + $("evDate").value + "&every=" + $("evRep").value);
  $("evText").value = ""; renderEvents(); togglePanel(false);
};
// Le panneau se referme seul après 2 min pour que l'écran reste épuré.
var panelTimer;
function togglePanel(open) {
  $("evPanel").hidden = !open; $("evToggle").textContent = open ? "Fermer" : "+ Ajouter";
  clearTimeout(panelTimer); if (open) panelTimer = setTimeout(function () { togglePanel(false); }, 120000);
}
$("evToggle").onclick = function () { togglePanel($("evPanel").hidden); };
renderEvents();
// Rafraîchit "Aujourd'hui / Demain" après minuit.
var lastDay = ymd(today());
setInterval(function () { if (ymd(today()) !== lastDay) { lastDay = ymd(today()); renderEvents(); } }, 60000);

/* ---------- Photos : dossier Google Drive partagé, relu toutes les 10 min ---------- */
function photoMsg(t) { $("photoMsg").textContent = t || ""; $("photoMsg").hidden = !t; }
var photos = [], idx = -1, layers = [$("imgA"), $("imgB")], front = 0;
function refreshPhotos() {
  if (!DRIVE_FOLDER_ID || !DRIVE_API_KEY) { photoMsg("Cadre photo pas encore relié à Google Drive"); return; }
  var q = encodeURIComponent("'" + DRIVE_FOLDER_ID + "' in parents and mimeType contains 'image/' and trashed = false");
  fetch("https://www.googleapis.com/drive/v3/files?pageSize=1000&orderBy=createdTime desc&fields=files(id)&q=" + q + "&key=" + DRIVE_API_KEY)
    .then(function (r) { return r.json(); }).then(function (d) {
      if (!d.files) throw d;
      var first = !photos.length;
      photos = d.files.map(function (f) { return f.id; });
      if (idx >= photos.length) idx = -1;
      photoMsg(photos.length ? "" : "Ajoute des photos dans le dossier Google Drive « Cadre photo »");
      if (!photos.length) layers.forEach(function (l) { l.className = ""; });
      else if (first) next(true);
    }).catch(function () { if (!photos.length) photoMsg("Photos indisponibles (connexion ou réglage Drive)"); });
}
function next(force) {
  if (!photos.length || (photos.length === 1 && !force)) return;
  idx = (idx + 1) % photos.length;
  var back = 1 - front, img = layers[back];
  img.onload = function () { img.className = "on"; layers[front].className = ""; front = back; };
  img.onerror = function () { img.onerror = null; };
  // Google redimensionne à 2048 px : léger pour le vieil iPad.
  img.src = "https://drive.google.com/thumbnail?sz=w2048&id=" + photos[idx];
}
setInterval(next, 12000);              // durée d'affichage d'une photo
setInterval(refreshPhotos, 10 * 60000); // nouvelles photos du téléphone
refreshPhotos();
</script>
